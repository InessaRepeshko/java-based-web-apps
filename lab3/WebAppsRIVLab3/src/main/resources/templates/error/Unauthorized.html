<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unauthorized Error</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icon/favicon_square.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container-fluid p-0 m-0 vh-100 d-flex justify-items-center flex-column align-content-center">
    <div class="row align-content-center justify-content-center mt-5">
        <div class="card border border-2 border-danger-subtle
                    shadow bg-danger-subtle rounded mt-5 w-50 p-0">
            <div class="card-header bg-danger-subtle border-bottom border-2 border-danger-subtle
                            font-monospace text-center text-secondary-emphasis fw-bolder">
                <span class="badge text-bg-danger">401</span>
                Unauthorized Error
            </div>

            <div class="card-body bg-light font-monospace">
                <div class="card-text text-secondary-emphasis fw-light text-center">
                    <p>Authorisation <code class="text-danger">failed</code> due to entering invalid credentials.</p>
                    <p>Please, try again!</p>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-center mt-5">
            <button class="btn btn-outline-info" type="button" onclick="window.history.back()">
                <i class="bi bi-box-arrow-in-left"></i>
            </button>
        </div>
    </div>

    <div class="mt-auto m-0 p-0">
        <footer th:replace="~{component/Footer :: footer}"></footer>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
