<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${errorTitle}">Error</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icon/favicon_square.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:if="${errorCode != 401}">
    <header th:replace="~{component/NavigationBar :: header}" class="flex-shrink-0"></header>
</div>

<main class="container-fluid flex-fill d-flex align-items-center justify-content-center">
    <div class="row w-100">
        <div class="card border border-2 border-danger-subtle
                    shadow bg-danger-subtle rounded mx-auto my-auto w-50 p-0">
            <div class="card-header bg-danger-subtle border-bottom border-2 border-danger-subtle
                            font-monospace text-center text-secondary-emphasis fw-bolder">
                <span class="badge text-bg-danger" th:text="${errorCode}">500</span>
                <span th:text="${errorTitle}">Error</span>
            </div>

            <div class="card-body bg-light font-monospace">
                <div class="card-text text-secondary-emphasis fw-light text-center">
                    <p th:text="${errorMessage}">Oops! Something went wrong.</p>
                    <p th:text="${errorException}" th:if="${errorException != null}"></p>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-center mt-5" th:switch="${errorCode}">
            <button th:case="401" class="btn btn-outline-info" type="button" onclick="window.history.back()">
                <i class="bi bi-box-arrow-in-left"></i>
            </button>
            <a th:case="*" th:href="@{/home}" class="btn btn-outline-info" type="button">
                <i class="bi bi-house"></i>
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{component/Footer :: footer}" class="flex-shrink-0"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
