<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icon/favicon_square.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{component/ErrorToast :: errorToast}"></div>

<div class="container-fluid vh-100 p-0 m-0 flex-column d-flex align-content-center justify-items-center">
    <div class="row align-content-center justify-content-center mt-2">
        <h1 class="w-50  text-info bg-info-subtle border border-3 rounded-pill border-info-subtle
               fs-1 fw-semibold font-monospace text-center
               shadow-lg p-2 mb-5 mt-2 bg-body-tertiary rounded">
            <img class="rounded-circle" th:src="@{/image/icon/favicon_square.png}"
                 width="80" height="80" alt="Favicon">
            <span class="p-0 m-0 ms-2">Student Database Viewer</span>
        </h1>
    </div>

    <div class="row text-center justify-content-center align-content-center">
        <h2 class="w-25 text-info bg-info-subtle border border-3 rounded-pill border-info-subtle
                   fs-3 fw-semibold font-monospace text-center
                   shadow p-2 mb-3 bg-body-tertiary rounded">
            Login
        </h2>
    </div>

    <div class="row text-center justify-content-center align-content-center">
        <div class="w-50 card border border-2 border-info-subtle p-5
                    shadow mb-5 bg-body-tertiary rounded">
            <div class="card-body bg-light font-monospace">
                <form id="login-form" th:action="@{/process-login}" method="POST">
                    <div class="input-group mb-5 border border-1 border-info-subtle rounded">
                        <span class="col-4 input-group-text text-info">Login</span>
                        <input type="text" class="col-auto form-control text-dark" name="login" required
                               th:value="${userLogin}">
                    </div>

                    <div class="input-group mb-5 border border-1 border-info-subtle rounded">
                        <span class="col-4 input-group-text text-info">Password</span>
                        <input type="password" class="col-auto form-control text-dark" name="password" required
                               th:value="${userPassword}">
                    </div>

                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-outline-info" name="submit">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="mt-auto p-0">
        <footer th:replace="~{component/Footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
