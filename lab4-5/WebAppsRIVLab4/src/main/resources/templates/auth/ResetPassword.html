<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icon/favicon_square.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{component/ErrorToast :: errorToast}"></div>
<div th:replace="~{component/WarningToast :: warningToast}"></div>
<div th:replace="~{component/SuccessToast :: successToast}"></div>

<div class="container-fluid vw-100 p-0 m-0 flex-column d-flex align-content-center justify-items-center">
    <div class="row align-content-center justify-content-center mt-2">
        <h1 class="w-50 text-info bg-info-subtle border border-3 rounded-pill border-info-subtle
               fs-1 fw-semibold font-monospace text-center shadow-lg p-2 mb-5 mt-2 bg-body-tertiary rounded">
            <img class="rounded-circle" th:src="@{/image/icon/favicon_square.png}"
                 width="80" height="80" alt="Favicon">
            <span class="p-0 m-0 ms-2">Student Database Viewer</span>
        </h1>
    </div>

    <div class="row text-center justify-content-center align-content-center">
        <div class="w-50 card border border-2 border-info-subtle shadow mb-5 bg-body-tertiary rounded p-0 m-0">
            <div class="card-header bg-info-subtle border-bottom border-2 border-info-subtle
                        font-monospace text-center text-info fw-bolder fs-4">
                <i class="bi bi-key-fill"></i>
                Reset Password
            </div>
            <div class="card-body bg-light font-monospace p-5 pb-0">
                <form id="reset-password-form" th:action="@{/reset-password}" th:method="'post'" th:object="${user}">
                    <div class="input-group mb-5 border border-1 border-info-subtle rounded">
                        <span class="col-4 input-group-text text-info">Corporate Email</span>
                        <input type="text" class="col-auto form-control text-dark" required id="inputCorporateEmail"
                               th:field="*{corporateEmail}">
                    </div>

                    <div class="d-flex justify-content-center mb-5">
                        <button type="submit" class="btn btn-outline-info" name="resetPassword">
                            <i class="bi bi-envelope"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center mb-5">
        <a class="btn btn-outline-info" type="button"
           th:title="'Go to Login'"
           th:href="@{/login}">
            <i class="bi bi-arrow-left"></i>
        </a>
    </div>

    <div class="mt-auto p-0">
        <footer th:replace="~{component/Footer :: footer}"></footer>
    </div>
</div>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
        setEmailInputValidity();

        const form = document.getElementById('reset-password-form');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            if (!form.checkValidity()) {
                event.stopPropagation();
                form.reportValidity();
            } else {
                form.submit();
            }
        });
    });

    function setEmailInputValidity() {
        const regexCorporateEmail = new RegExp("^[a-z](\\.?[a-z]+){1,99}@[a-z]{1,10}\\.khpi\\.edu\\.ua$");
        document.getElementById('inputCorporateEmail').setAttribute('pattern', regexCorporateEmail.source);

        const message = "The corporate email should match the format 'name.surname@faculty.khpi.edu.ua'.";

        document.getElementById('inputCorporateEmail').addEventListener('input', function () {
            if (this.validity.patternMismatch) {
                this.setCustomValidity(message);
            } else {
                this.setCustomValidity('');
            }

            this.reportValidity();
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
