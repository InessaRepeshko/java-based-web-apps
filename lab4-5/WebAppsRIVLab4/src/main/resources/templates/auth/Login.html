<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icon/favicon_square.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{component/ErrorToast :: errorToast}"></div>
<div th:replace="~{component/WarningToast :: warningToast}"></div>
<div th:replace="~{component/SuccessToast :: successToast}"></div>

<div class="container-fluid vw-100 p-0 m-0 flex-column d-flex align-content-center justify-items-center">
    <div class="row align-content-center justify-content-center mt-2">
        <h1 class="w-50 text-info bg-info-subtle border border-3 rounded-pill border-info-subtle
               fs-1 fw-semibold font-monospace text-center shadow-lg p-2 mb-5 mt-2 bg-body-tertiary rounded">
            <img class="rounded-circle" th:src="@{/image/icon/favicon_square.png}"
                 width="80" height="80" alt="Favicon">
            <span class="p-0 m-0 ms-2">Student Database Viewer</span>
        </h1>
    </div>

    <div class="row text-center justify-content-center align-content-center">
        <div class="w-50 card border border-2 border-info-subtle shadow mb-5 bg-body-tertiary rounded p-0 m-0">
            <div class="card-header bg-info-subtle border-bottom border-2 border-info-subtle
                        font-monospace text-center text-info fw-bolder fs-4">
                <i class="bi bi-person-circle"></i>
                Sign In
            </div>
            <div class="card-body bg-light font-monospace p-5 pb-0">
                <form id="login-form" th:action="@{/login}" method="POST" th:object="${user}">
                    <div class="input-group mb-5 border border-1 border-info-subtle rounded">
                        <span class="col-4 input-group-text text-info">Username or Email</span>
                        <input type="text" class="col-auto form-control text-dark" required
                               th:field="*{corporateEmailOrUsername}" id="inputCorporateEmailOrUsername">
                    </div>

                    <div class="input-group mb-4 border border-1 border-info-subtle rounded">
                        <span class="col-4 input-group-text text-info">Password</span>
                        <input type="password" class="col-auto form-control text-dark" required
                               th:field="*{password}" id="inputPassword">
                    </div>

                    <div class="d-flex justify-content-center mb-4">
                        <div class="form-check form-switch custom-control custom-switch ">
                            <input class="form-check-input btn btn-info bg-info border border-info focus-ring focus-ring-info text-end"
                                   style="--bs-btn-active-bg: rgba(var(--bs-info-rgb), .25);"
                                   type="checkbox" role="switch" id="rememberMe" name="remember-me">
                            <label class="form-check-label text-info text-start" for="rememberMe">Remember me</label>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-outline-info" name="login">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </button>
                    </div>
                </form>
            </div>

            <div class="card-footer bg-light font-monospace px-5 pb-4 pt-4 m-0 border-0 d-flex justify-content-evenly">
                <a class="link-info link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
                   th:href="@{/register}">
                    <i class="bi bi-box-arrow-in-up-right"></i>
                    New around here? Sign up
                </a>
                <a class="link-info link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
                   th:href="@{/reset-password}">
                    <i class="bi bi-key"></i>
                    Forgot password?
                </a>
            </div>
        </div>
    </div>

    <div class="mt-auto p-0">
        <footer th:replace="~{component/Footer :: footer}"></footer>
    </div>
</div>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
        setEmailInputValidity();
        setPasswordInputValidity()

        const form = document.getElementById('login-form');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            if (!form.checkValidity()) {
                event.stopPropagation();
                form.reportValidity();
            } else {
                form.submit();
            }
        });
    });

    function setEmailInputValidity() {
        const regexUsername = /^(?=.{8,32}$)[a-zA-Z0-9\W]+$/;
        const regexCorporateEmail = /"^[a-z](\\.?[a-z]+){1,99}@[a-z]{1,10}\\.khpi\\.edu\\.ua$"/;

        const message = "Enter corporate email or username. " +
            "The corporate email should match the format 'name.surname@faculty.khpi.edu.ua'. " +
            "The username must contain Latin letters and may contain numbers and special characters '.', '_', '-'.";

        document.getElementById('inputCorporateEmailOrUsername').addEventListener('input', function () {
            const value = this.value;

            // if (this.validity.patternMismatch) {
            if (!regexCorporateEmail.test(value) && !regexUsername.test(value)) {
                this.setCustomValidity(message);
            } else {
                this.setCustomValidity('');
            }

            this.reportValidity();
        });
    }

    function setPasswordInputValidity() {
        const regexPassword = /^(?=.{8,50}$)(?=.*[A-Z])(?=.*[0-9])(?=.*[\W])[A-Za-z0-9\W]*$/;
        document.getElementById('inputPassword').setAttribute('pattern', regexPassword.source);

        const message = "The password must contain Latin letters, at least one capital letter and one special character.";

        document.getElementById('inputPassword').addEventListener('input', function () {
            if (this.validity.patternMismatch) {
                this.setCustomValidity(message);
            } else {
                this.setCustomValidity('');
            }

            this.reportValidity();
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
