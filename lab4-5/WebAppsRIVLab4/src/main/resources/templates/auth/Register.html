<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icon/favicon_square.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:replace="~{component/ErrorToast :: errorToast}"></div>
<div th:replace="~{component/WarningToast :: warningToast}"></div>
<div th:replace="~{component/SuccessToast :: successToast}"></div>

<div class="container-fluid vw-100 m-0 p-0 text-center justify-content-center">
    <div class="row align-content-center justify-content-center mt-2">
        <h1 class="w-50 text-info bg-info-subtle border border-3 rounded-pill border-info-subtle
                   fs-1 fw-semibold font-monospace text-center shadow-lg p-2 mb-1 mt-2 bg-body-tertiary rounded">
            <img class="rounded-circle" th:src="@{/image/icon/favicon_square.png}"
                 width="80" height="80" alt="Favicon">
            <span class="p-0 m-0 ms-2">Student Database Viewer</span>
        </h1>
    </div>

    <div class="row text-center justify-content-center align-content-center">
    <div class="card w-50 border border-2 border-info-subtle shadow bg-body-tertiary rounded m-0 mt-5 p-0">
        <div class="card-header bg-info-subtle border-bottom border-2 border-info-subtle
                    font-monospace text-center text-info fw-bolder fs-4" id="formHeader">
            <i class="bi bi-person-circle"></i>
            Sign Up
        </div>

        <form class="card-body bg-light font-monospace p-5 m-0" id="userForm"
              th:object="${user}"
              th:action="@{/register}"
              th:method="'post'">

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputSurname" class=" col-4 input-group-text text-info">Surname</label>
                    <input id="inputSurname" class="col-auto form-control text-dark" type="text" required
                           th:field="*{surname}"
                           th:minlength="1" th:maxlength="50">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputName" class="col-4 input-group-text text-info">Name</label>
                    <input id="inputName" class="col-auto form-control text-dark" type="text" required
                           th:field="*{name}"
                           th:minlength="1" th:maxlength="50">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded ">
                    <label for="inputPatronymic" class="col-4 input-group-text text-info">Patronymic</label>
                    <input id="inputPatronymic" class="col-auto form-control text-dark" type="text" required
                           th:field="*{patronymic}"
                           th:minlength="1" th:maxlength="50">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputCorporateEmail" class="col-4 input-group-text text-info">Corporate Email</label>
                    <input id="inputCorporateEmail" class="col-auto form-control text-dark" type="text" required
                           th:field="*{corporateEmail}"
                           th:minlength="17" th:maxlength="123">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputUsername" class="col-4 input-group-text text-info">Username</label>
                    <input id="inputUsername" class="col-auto form-control text-dark" type="text" required
                           th:field="*{username}"
                           th:minlength="8" th:maxlength="32">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputPassword" class="col-4 input-group-text text-info">Password</label>
                    <input id="inputPassword" class="col-auto form-control text-dark" type="password"
                           th:field="*{password}"
                           th:minlength="8" th:maxlength="50">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputConfirmPassword" class="col-4 input-group-text text-info">Confirm Password</label>
                    <input id="inputConfirmPassword" class="col-auto form-control text-dark" type="password"
                           th:field="*{confirmPassword}"
                           th:minlength="8" th:maxlength="50">
                </div>
            </div>

            <div class="d-flex justify-content-evenly">
                <button type="submit" class="btn btn-outline-info border-2"
                        th:title="'Save'">
                    <i class="bi bi-floppy"></i>
                </button>

                <button type="reset" class="btn btn-outline-info border-2"
                        onclick="form.reset()"
                        th:title="'Reset fields'">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </form>
    </div>
</div>

    <div class="d-flex justify-content-center mt-5">
        <a class="btn btn-outline-info" type="button"
           th:title="'Go to Login'"
           th:href="@{/login}">
            <i class="bi bi-arrow-left"></i>
        </a>
    </div>
</div>

<footer th:replace="~{component/Footer :: footer}"></footer>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
        fillUsernameOnCorpEmail();
        setAllInputsValidity();
    });

    function fillUsernameOnCorpEmail() {
        const corporateEmailInput = document.getElementById("inputCorporateEmail");
        const usernameInput = document.getElementById("inputUsername");

        corporateEmailInput.addEventListener("input", function () {
            const emailValue = corporateEmailInput.value;
            const atIndex = emailValue.indexOf("@");

            if (atIndex > 0) {
                usernameInput.value = emailValue.substring(0, atIndex).trim();
            } else {
                usernameInput.value = "";
            }
        });
    }

    function setAllInputsValidity() {
        setPatternAttr();
        setAllStringInputValidity();

        const form = document.getElementById('userForm');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            if (!form.checkValidity()) {
                event.stopPropagation();
                form.reportValidity();
            } else {
                form.submit();
            }
        });

        function setPatternAttr() {
            const regexNames = new RegExp("^(?=.{1,50}$)[А-ЩЮЯҐЄІЇ](?:[А-ЯҐЄІЇа-яґєіїʼ]*[А-ЯҐЄІЇа-яґєії])?(?:[ \\-][А-ЩЮЯҐЄІЇ](?:[А-ЯҐЄІЇа-яґєіїʼ]*[А-ЯҐЄІЇа-яґєії])?)*$");
            const regexCorporateEmail = new RegExp("^[a-z](\\.?[a-z]+){1,99}@[a-z]{1,10}\\.khpi\\.edu\\.ua$");
            const regexUsername = /^(?=.{8,32}$)[a-zA-Z0-9._-]+$/;
            const regexPassword = /^(?=.{8,50}$)(?=.*[A-Z])(?=.*[0-9])(?=.*[\W])[A-Za-z0-9\W]*$/;

            document.getElementById('inputSurname').setAttribute('pattern', regexNames.source);
            document.getElementById('inputName').setAttribute('pattern', regexNames.source);
            document.getElementById('inputPatronymic').setAttribute('pattern', regexNames.source);

            document.getElementById('inputCorporateEmail').setAttribute('pattern', regexCorporateEmail.source);
            document.getElementById('inputUsername').setAttribute('pattern', regexUsername.source);

            document.getElementById('inputPassword').setAttribute('pattern', regexPassword.source);
            document.getElementById('inputConfirmPassword').setAttribute('pattern', regexPassword.source);
        }


        function setAllStringInputValidity() {
            const messages = [
                "Value must be Ukrainian char string between 1 and 50 chars long, including space and apostrophe.",
                "Value must be Ukrainian char string between 1 and 50 chars long, including space and apostrophe.",
                "Value must be Ukrainian char string between 1 and 50 chars long, including space and apostrophe.",
                "The corporate email should match the format 'name.surname@faculty.khpi.edu.ua'.",
                "The username must contain Latin letters and may contain numbers and special characters '.', '_', '-'.",
                "The password must contain Latin letters, at least one capital letter and one special character.",
                "The password must contain Latin letters, at least one capital letter and one special character.",
            ];

            document.getElementById('userForm')
                .querySelectorAll('input[pattern]')
                .forEach((input, i) => {
                    input.addEventListener('input', function () {
                        if (this.validity.patternMismatch) {
                            this.setCustomValidity(messages[i]);
                        } else {
                            this.setCustomValidity('');
                        }

                        this.reportValidity();
                    });
                });
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
