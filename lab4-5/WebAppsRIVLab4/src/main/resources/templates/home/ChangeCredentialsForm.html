<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Credentials</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icon/favicon_square.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header th:replace="~{component/NavigationBar :: header}"></header>

<div th:replace="~{component/ErrorToast :: errorToast}"></div>
<div th:replace="~{component/WarningToast :: warningToast}"></div>
<div th:replace="~{component/SuccessToast :: successToast}"></div>

<div class="container w-75 text-center justify-content-center">
    <div class="card border border-3 border-info-subtle shadow bg-body-tertiary rounded m-0 mt-5 p-0">
        <div class="card-header bg-info-subtle border-bottom border-3 border-info-subtle
                    font-monospace text-center text-info fw-bolder fs-4" id="formHeader">
            <i class="bi bi-unlock-fill"></i>
            Change Credentials
        </div>

        <form class="card-body bg-light font-monospace p-5 m-0" id="changeCredentialsForm"
              th:object="${userChangeCredentials}"
              th:action="@{/profile/change-credentials}"
              th:method="'post'">
            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputUsername" class="col-3 input-group-text text-info">Username</label>
                    <input id="inputUsername" class="col-auto form-control text-dark" required
                           type="text" name="username" th:minLength="8" th:maxlength="32"
                           th:field="*{username}">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputPassword" class="col-3 input-group-text text-info">Password</label>
                    <input id="inputPassword" class="col-auto form-control text-dark" required
                           type="password" name="password" th:minLength="8" th:maxlength="50"
                           th:field="*{password}">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputConfirmPassword" class="col-3 input-group-text text-info">Confirm Password</label>
                    <input id="inputConfirmPassword" class="col-auto form-control text-dark" required
                           type="password" name="confirmPassword" th:minLength="8" th:maxlength="50"
                           th:field="*{confirmPassword}">
                </div>
            </div>

            <div class="d-flex justify-content-evenly">
                <button type="submit" class="btn btn-outline-info border-2"
                        th:title="'Save'">
                    <i class="bi bi-floppy"></i>
                </button>

                <button type="reset" class="btn btn-outline-info border-2"
                        onclick="form.reset()"
                        th:title="'Reset fields'">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </form>
    </div>

    <div class="d-flex justify-content-center mt-5">
        <a class="btn btn-outline-info" type="button"
           th:title="'Go to Home'"
           th:href="@{/home}">
            <i class="bi bi-arrow-left"></i>
        </a>
    </div>
</div>

<footer th:replace="~{component/Footer :: footer}"></footer>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
        setPatternAttr();
        setAllStringInputValidity();

        const form = document.getElementById('changeCredentialsForm');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            if (!form.checkValidity()) {
                event.stopPropagation();
                form.reportValidity();
            } else {
                form.submit();
            }
        });

        document.getElementById('inputUsername').setAttribute('value', document.getElementById('currentUsername').innerText);
    });

    function setPatternAttr() {
        const regexUsername = /^(?=.{8,32}$)[a-zA-Z0-9._-]+$/;
        const regexPassword = /^(?=.{8,50}$)(?=.*[A-Z])(?=.*[0-9])(?=.*[\W])[A-Za-z0-9\W]*$/;

        document.getElementById('inputUsername').setAttribute('pattern', regexUsername.source);
        document.getElementById('inputPassword').setAttribute('pattern', regexPassword.source);
        document.getElementById('inputConfirmPassword').setAttribute('pattern', regexPassword.source);
    }


    function setAllStringInputValidity() {
        const messages = [
            "The username must contain Latin letters and may contain numbers and special characters '.', '_', '-'.",
            "The password must contain Latin letters, at least one capital letter and one special character.",
            "The password must contain Latin letters, at least one capital letter and one special character.",
        ];

        document.getElementById('changeCredentialsForm')
            .querySelectorAll('input[pattern]')
            .forEach((input, i) => {
                input.addEventListener('input', function () {
                    if (this.validity.patternMismatch) {
                        this.setCustomValidity(messages[i]);
                    } else {
                        this.setCustomValidity('');
                    }

                    this.reportValidity();
                });
            });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
