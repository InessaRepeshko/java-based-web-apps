<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icon/favicon_square.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header th:replace="~{component/NavigationBar :: header}"></header>

<div th:replace="~{component/ErrorToast :: errorToast}"></div>
<div th:replace="~{component/WarningToast :: warningToast}"></div>
<div th:replace="~{component/SuccessToast :: successToast}"></div>

<div class="container w-75 text-center justify-content-center">
    <div class="card border border-3 border-info-subtle shadow bg-body-tertiary rounded m-0 mt-5 p-0">
        <div class="card-header bg-info-subtle border-bottom border-3 border-info-subtle
                    font-monospace text-center text-info fw-bolder fs-4" id="formHeader">
            <i class="bi bi-person-circle"></i>
            Profile
        </div>

        <form class="card-body bg-light font-monospace p-5 m-0" id="profileForm"
              th:object="${user}"
              th:action="@{/profile}"
              th:method="'post'">
            <div class="d-none card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputUserId" class="col-4 input-group-text text-info">Id</label>
                    <input id="inputUserId" class="col-auto form-control text-secondary" type="hidden" required
                           th:field="*{id}"
                           th:minlength="1" th:maxlength="100"
                           th:readonly="${true}">
                </div>
            </div>

            <div class="d-none card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputSurname" class=" col-3 input-group-text text-info">Surname</label>
                    <input id="inputSurname" class="col-auto form-control text-secondary" type="hidden" required
                           th:field="*{surname}"
                           th:minlength="1" th:maxlength="50"
                           th:readonly="${true}">
                </div>
            </div>

            <div class="d-none card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputName" class=" col-3 input-group-text text-info">Name</label>
                    <input id="inputName" class="col-auto form-control text-secondary" type="hidden" required
                           th:field="*{name}"
                           th:minlength="1" th:maxlength="50"
                           th:readonly="${true}">
                </div>
            </div>

            <div class="d-none card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded ">
                    <label for="inputPatronymic" class=" col-3 input-group-text text-info">Patronymic</label>
                    <input id="inputPatronymic" class="col-auto form-control text-secondary" type="hidden" required
                           th:field="*{patronymic}"
                           th:minlength="1" th:maxlength="50"
                           th:readonly="${true}">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded ">
                    <label for="inputFullname" class=" col-4 input-group-text text-info">Full Name</label>
                    <input id="inputFullname" class="col-auto form-control text-secondary" type="text" required
                           th:name="'fullname'"
                           th:value="${user?.surname + ' ' + user?.name + ' ' + user?.patronymic}"
                           th:minlength="1" th:maxlength="200"
                           th:readonly="${true}">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputCorporateEmail" class="col-4 input-group-text text-info">Corporate Email</label>
                    <input id="inputCorporateEmail" class="col-auto form-control text-secondary" type="text" required
                           th:field="*{corporateEmail}"
                           th:minlength="17" th:maxlength="123"
                           th:readonly="${true}">
                </div>
            </div>

            <div class="card-text mb-4">
                <div class="input-group border border-1 border-info-subtle rounded">
                    <label for="inputUsername" class="col-4 input-group-text text-info">Username</label>
                    <input id="inputUsername" class="col-auto form-control text-secondary" type="text" required
                           th:field="*{username}"
                           th:minlength="8" th:maxlength="32"
                           th:readonly="${true}">
                </div>
            </div>

            <div class="card-text d-flex align-content-center justify-content-start">
                <div class="col-4 border border-1 border-info-subtle rounded d-inline-flex p-0 m-0 me-3">
                    <span class="d-flex flex-fill input-group-text text-info">Role</span>
                </div>
                <div class="col-auto text-center align-content-center" th:switch="${user?.role?.name()}">
                    <button th:case="${T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ADMIN.name()}"
                            th:text="${user?.role?.getValue()}"
                            style="color: #fd7e14; border-color: #fd7e14;"
                            class="btn btn-outline-info border-2 fw-bolder"
                            disabled data-bs-toggle="button"></button>
                    <button th:case="${T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_MANAGER.name()}"
                            th:text="${user?.role?.getValue()}"
                            style="color: #198754; border-color: #198754;"
                            class="btn btn-outline-info border-2 fw-bolder"
                            disabled data-bs-toggle="button"></button>
                    <button th:case="${T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).STUDENT_MANAGER.name()}"
                            th:text="${user?.role?.getValue()}"
                            style="color: #6f42c1; border-color: #6f42c1;"
                            class="btn btn-outline-info border-2 fw-bolder"
                            disabled data-bs-toggle="button"></button>
                    <button th:case="${T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_VIEWER.name()}"
                            th:text="${user?.role?.getValue()}"
                            style="color: #20c997; border-color: #20c997;"
                            class="btn btn-outline-info border-2 fw-bolder"
                            disabled data-bs-toggle="button"></button>
                    <button th:case="${T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).STUDENT_VIEWER.name()}"
                            th:text="${user?.role?.getValue()}"
                            style="color: #6610f2; border-color: #6610f2;"
                            class="btn btn-outline-info border-2 fw-bolder"
                            disabled data-bs-toggle="button"></button>
                </div>
            </div>

            <div class="d-flex justify-content-evenly mt-5">
                <a th:href="@{/profile/change-credentials}" type="button" class="btn btn-outline-info border-2"
                   th:title="'Change Credentials'">
                    <i class="bi bi-key"></i>
                    Change Credentials
                </a>
            </div>
        </form>
    </div>

    <div class="d-flex justify-content-center mt-5">
        <a class="btn btn-outline-info" type="button"
           th:title="'Go to Home'"
           th:href="@{/home}">
            <i class="bi bi-house"></i>
        </a>
    </div>
</div>

<footer th:replace="~{component/Footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
