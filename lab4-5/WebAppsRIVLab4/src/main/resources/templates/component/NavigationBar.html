<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Header</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icon/favicon_square.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<header th:fragment="header">
    <nav class="container-fluid navbar navbar-expand-lg bg-info-subtle text-info-emphasis font-monospace">
        <div class="mx-3">
            <div class="navbar-brand text-info">
                <img class="rounded-circle" width="50" height="50" alt="Favicon"
                     th:src="@{/image/icon/favicon_square.png}">
                <span class="p-0 m-0 ms-2">Student Database Viewer</span>
            </div>
        </div>

        <div class="mx-3">
            <button class="navbar-toggler" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>

        <div class="collapse navbar-collapse mx-3" id="navbarNavAltMarkup">
            <div class="navbar-nav font-monospace text-info d-flex align-items-center justify-content-between flex-fill">
                <div class="nav-item me-5 text-info">
                    <a class="nav-link link-info link-offset-0 link-underline link-underline-opacity-0 link-underline-opacity-0-hover"
                       aria-current="page" th:href="@{/home}">
                        <i class="bi bi-house-fill"></i>
                        Home
                    </a>
                </div>

                <div class="nav-item dropdown me-5 align-content-center text-info"
                     sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ADMIN.name())">
                    <div class="nav-item dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                         aria-expanded="false">
                        <i class="bi bi-person-fill"></i>
                        Users
                    </div>

                    <ul class="dropdown-menu font-monospace text-start text-secondary-emphasis">
                        <li>
                            <a class="dropdown-item link-info link-offset-0 link-underline link-underline-opacity-0 link-underline-opacity-0-hover"
                               th:href="@{/users}">User Table</a>
                        </li>
                        <li>
                            <a class="dropdown-item link-info link-offset-0 link-underline link-underline-opacity-0 link-underline-opacity-0-hover"
                               th:href="@{/users/add}">Add User</a>
                        </li>
                    </ul>
                </div>

                <div class="nav-item dropdown me-5 align-content-center text-info"
                     sec:authorize="hasAnyRole(
                     T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_VIEWER.name(),
                     T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).STUDENT_VIEWER.name())">
                    <div class="nav-item dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                         aria-expanded="false">
                        <i class="bi bi-table"></i>
                        Tables
                    </div>

                    <ul class="dropdown-menu font-monospace text-start text-secondary-emphasis">
                        <li sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_VIEWER.name())">
                            <a class="dropdown-item link-info link-offset-0 link-underline link-underline-opacity-0 link-underline-opacity-0-hover"
                               th:href="@{/entrants}">Entrant Table</a>
                        </li>
                        <li sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).STUDENT_VIEWER.name())">
                            <a class="dropdown-item link-info link-offset-0 link-underline link-underline-opacity-0 link-underline-opacity-0-hover"
                               th:href="@{/students}">Student Table</a>
                        </li>
                    </ul>
                </div>

                <div class="nav-item dropdown me-5 align-content-center text-info"
                     sec:authorize="hasAnyRole(
                     T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_MANAGER.name(),
                     T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).STUDENT_MANAGER.name())">
                    <div class="nav-item dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                         aria-expanded="false">
                        <i class="bi bi-person-plus-fill"></i>
                        Add Record
                    </div>

                    <ul class="dropdown-menu font-monospace text-start text-secondary-emphasis">
                        <li sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_MANAGER.name())">
                            <a class="dropdown-item link-info link-offset-0 link-underline link-underline-opacity-0 link-underline-opacity-0-hover"
                               th:href="@{/entrants/add}">Add Entrant</a>
                        </li>
                        <li sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).STUDENT_MANAGER.name())">
                            <a class="dropdown-item link-info link-offset-0 link-underline link-underline-opacity-0 link-underline-opacity-0-hover"
                               th:href="@{/students/add}">Add Student</a>
                        </li>
                    </ul>
                </div>

                <div class="nav-item dropdown ms-auto align-content-center text-info"
                     sec:authorize="isAuthenticated()">
                    <div class="nav-item dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                         aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name" id="currentUsername"></span>
                    </div>

                    <ul class="dropdown-menu font-monospace text-start text-secondary-emphasis">
                        <li>
                            <a class="dropdown-item link-info link-offset-0 link-underline link-underline-opacity-0 link-underline-opacity-0-hover"
                               th:href="@{/profile}">
                                Profile
                            </a>
                        </li>
                        <li>
                            <div class="dropdown-item">
                                <form th:action="@{/logout}" th:method="'post'" class="m-0 p-0">
                                    <button type="submit" id="logout" class="nav-link btn btn-link link-info
                                    link-offset-0 link-underline link-underline-opacity-0 link-underline-opacity-0-hover
                                    m-0 p-0">
                                        Logout
                                    </button>
                                </form>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
