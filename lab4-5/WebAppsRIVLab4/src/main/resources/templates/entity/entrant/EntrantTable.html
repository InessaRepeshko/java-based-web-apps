<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrant Table</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icon/favicon_square.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header th:replace="~{component/NavigationBar :: header}"></header>

<div th:replace="~{component/ErrorToast :: errorToast}"></div>
<div th:replace="~{component/WarningToast :: warningToast}"></div>
<div th:replace="~{component/SuccessToast :: successToast}"></div>

<div class="mx-3 mt-3 mb-5 font-monospace">
    <div class="row">
        <h1 class="text-info fs-1 my-3 fw-semibold text-center">Entrant Table</h1>
    </div>

    <div class="row align-items-start">
        <div class="col-2 mx-2">
            <div class="card row p-2 mb-4 border border-3 border-info-subtle bg-light shadow">
                <div class="card-body col">
                    <div class="card-title row">
                        <p class="text-info fs-5 fw-bold p-0 m-0">Search</p>
                        <p class="text-secondary fw-lighter p-0 m-0" style="font-size: 0.8rem;">
                            Search by case number, full name (matching start, case-insensitive)
                        </p>
                    </div>

                    <form class="card-text col mt-3" id="formSearch"
                          th:method="'get'" th:action="@{/entrants}">
                        <div class="row mb-3">
                            <label for="inputSearch" class="visually-hidden">Search</label>
                            <input type="search" class="form-control border border-2 border-info-subtle"
                                   id="inputSearch" name="search" placeholder="Type to search...">
                        </div>

                        <div class="col d-flex justify-content-evenly align-content-center text-center p-0 m-0">
                            <a type="button" id="btn-search" onclick="applySearch(this)"
                               class="btn btn-outline-info border-2" th:alt-title="'Apply Search'">
                                <i class="bi bi-search"></i>
                            </a>

                            <a type="button" id="btn-search-reset" onclick="resetSearch(this)"
                               class="btn btn-outline-info border-2 button-reset" th:title="'Reset Search'">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card row p-2 mb-4 border border-3 border-info-subtle bg-light shadow">
                <div class="card-body col">
                    <div class="card-title row">
                        <p class="text-info fs-5 fw-bold p-0 m-0">Filters</p>
                    </div>

                    <div class="card-subtitle row mt-2" id="filterBirthday">
                        <p class="text-info fs-6 fw-bold p-0 m-0">Birthday</p>
                    </div>

                    <form class="card-text col mt-2" id="formFilterBirthday"
                          th:method="'get'" th:action="@{/entrants}">
                        <div class="row mb-2">
                            <label for="inputBirthdayStart" class="form-label text-secondary fw-lighter py-0 px-1 m-0"
                                   style="font-size: 0.8rem;">Start</label>
                            <input type="date" class="form-control border border-2 border-info-subtle"
                                   id="inputBirthdayStart" name="birthdayStart">
                        </div>

                        <div class="row mb-3">
                            <label for="inputBirthdayEnd" class="form-label text-secondary fw-lighter py-0 px-1 m-0"
                                   style="font-size: 0.8rem;">End</label>
                            <input type="date" class="form-control border border-2 border-info-subtle"
                                   id="inputBirthdayEnd" name="birthdayEnd">
                        </div>

                        <div class="col d-flex justify-content-evenly align-content-center text-center p-0 m-0">
                            <a type="button" id="btn-filter-birthday" onclick="applyFilterBirthday(this)"
                               class="btn btn-outline-info border-2" th:title="'Apply Filter'">
                                <i class="bi bi-funnel"></i>
                            </a>

                            <a type="button" id="btn-filter-birthday-reset" onclick="resetFilterBirthday(this)"
                               class="btn btn-outline-info border-2 button-reset" th:title="'Reset Filter'">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </div>
                    </form>

                    <div class="card-subtitle row mt-4" id="filterRatingScore">
                        <p class="text-info fs-6 fw-bold p-0 m-0">RatingScore</p>
                    </div>

                    <form class="card-text col mt-2" id="formFilterRatingScore"
                          th:method="'get'" th:action="@{/entrants}">
                        <div class="row mb-2">
                            <label for="inputRatingScoreMin" class="form-label text-secondary fw-lighter py-0 px-1 m-0"
                                   style="font-size: 0.8rem;">Start</label>
                            <input type="number" class="form-control border border-2 border-info-subtle"
                                   id="inputRatingScoreMin" name="ratingScoreMin"
                                   th:min="120.001" th:max="200.000" th:step="0.001">
                        </div>

                        <div class="row mb-3">
                            <label for="inputRatingScoreMax" class="form-label text-secondary fw-lighter py-0 px-1 m-0"
                                   style="font-size: 0.8rem;">End</label>
                            <input type="number" class="form-control border border-2 border-info-subtle"
                                   id="inputRatingScoreMax" name="ratingScoreMax"
                                   th:min="120.001" th:max="200.000" th:step="0.001">
                        </div>

                        <div class="col d-flex justify-content-evenly align-content-center text-center p-0 m-0">
                            <a type="button" id="btn-filter-rating-score" onclick="applyFilterRatingScore(this)"
                               class="btn btn-outline-info border-2" th:title="'Apply Filter'">
                                <i class="bi bi-funnel"></i>
                            </a>

                            <a type="button" id="btn-filter-rating-score-reset" onclick="resetFilterRatingScore(this)"
                               class="btn btn-outline-info border-2 button-reset" th:title="'Reset Filter'">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card row p-2 mb-4 border border-3 border-info-subtle bg-light shadow"
                 sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_MANAGER.name())">
                <div class="card-body col">
                    <div class="card-title row">
                        <p class="text-info fs-5 fw-bold p-0 m-0">Add record</p>
                        <p class="text-secondary fw-lighter p-0 m-0" style="font-size: 0.8rem;">
                            Add new record to the end of the table
                        </p>
                    </div>

                    <form class="card-text col mt-3" id="formInsert"
                          th:method="'get'" th:action="@{/entrants}">
                        <div class="col d-flex justify-content-evenly align-content-center text-center p-0 m-0">
                            <a th:href="@{/entrants/add}" id="btn-add-entrant"
                               class="btn btn-outline-info border-2" role="button" th:title="'Add record'">
                                <i class="bi bi-plus-lg"></i>
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col">
            <table id="entrantTable" class="table table-sm table-hover font-monospace
                   table-bordered border border-3 border-info-subtle shadow-lg">
                <thead class="table-info text-center fw-medium text-secondary-emphasis">
                <tr>
                    <th class="text-center align-content-center text-info">#</th>

                    <div class="p-0 m-0" th:each="fieldName : ${fields}">
                        <th class="text-center align-content-center">
                            <div class="d-flex p-0 m-0">
                                <div class="flex-grow-1 align-content-center justify-content-center p-0 m-0">
                                    <span class="">
                                         <a class="sortLink link-info link-offset-2 link-offset-3-hover link-underline
                                                   link-underline-opacity-0 link-underline-opacity-75-hover"
                                            th:id="${fieldName[0]}" th:text="${fieldName[1]}"
                                            onclick="applySort(this)"></a>
                                    </span>
                                </div>
                                <div class="d-none flex-shrink-1 align-content-center justify-content-end ms-2 p-0 m-0"
                                     style="width: 20px;">
                                    <button type="button" class="btn bg-transparent p-0 m-0" title="Sort records">
                                        <i class="bi bi-sort-down-alt sortingAsc" th:title="'Ascending Sort'"></i>
                                        <i class="bi bi-sort-down sortingDesc" th:title="'Descending Sort'"></i>
                                    </button>
                                </div>
                            </div>
                        </th>
                    </div>

                    <th class="text-center align-content-center text-info"
                        sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_MANAGER.name())
                        and hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).STUDENT_VIEWER.name())">Operations</th>
                    <th class="text-center align-content-center text-info"
                        sec:authorize="!hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_MANAGER.name())
                        and hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).STUDENT_VIEWER.name())">Student Info</th>
                </tr>
                </thead>

                <tbody class="table-light fw-light text-primary-emphasis" th:each="entrant, iterStat : ${entrants}">
                <tr>
                    <td class="text-center align-content-center" th:text="${iterStat.index + 1}"></td>
                    <td class="text-start align-content-center" th:text="${entrant?.caseNumber}"></td>
                    <td class="text-start align-content-center"
                        th:text="${entrant?.surname} + ' ' + ${entrant?.name} + ' ' + ${entrant?.patronymic}"></td>
                    <td class="text-center align-content-center"
                        th:text="${#temporals.format(entrant?.birthday, 'dd.MM.yyyy')}"></td>
                    <td class="text-center align-content-center"
                        th:style="'color:' + (${entrant?.gender} ? '#0d6efd' : '#d63384')"
                        th:text="${entrant?.gender} ? 'чоловік' : 'жінка'"></td>
                    <td class="text-end align-content-center"
                        th:text="${#numbers.formatDecimal(entrant?.ratingScore, 3, 3, 'COMMA')}"></td>
                    <td class="text-center align-content-center"
                        sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).STUDENT_VIEWER.name())">
                        <div class="d-flex justify-content-evenly p-0 m-0"
                             sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).STUDENT_VIEWER.name())">
                            <a type="button" th:href="@{/students/__${entrant?.studentId}__/view}"
                               th:if="${entrant?.studentId ne null}"
                               class="col-1 p-0 m-0 border border-0 bg-transparent button-linked-entrant"
                               th:title="'Student info'">
                                <i class="bi bi-person-rolodex text-info"></i>
                            </a>
                            <span th:if="${entrant?.studentId eq null}" class="col-1"></span>
                            <a type="button" th:href="@{/entrants/__${entrant?.id}__/edit}"
                               sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_MANAGER.name())"
                               class="col-1 p-0 m-0 border border-0 bg-transparent button-update"
                               th:title="'Edit record'">
                                <i class="bi bi-pencil text-warning"></i>
                            </a>
                            <a type="button" th:href="@{/entrants/__${entrant?.id}__/delete}"
                               sec:authorize="hasRole(T(ntukhpi.csit.semit.riv.webappsrivlab4.model.DAO.enums.Role).ENTRANT_MANAGER.name())"
                               class="col-1 p-0 m-0 border border-0 bg-transparent button-delete"
                               th:title="'Delete record'">
                                <i class="bi bi-trash3 text-danger"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${entrants == null or entrants.isEmpty()}" class="text-dark text-center">No data available</p>
            <br>
        </div>
    </div>

    <div class="d-flex justify-content-center">
        <a th:href="@{/home}" class="btn btn-outline-info" type="button">
            <i class="bi bi-house"></i>
        </a>
    </div>
</div>

<footer th:replace="~{component/Footer :: footer}"></footer>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
        setSearchPatternAttr();
        setSearchInputValidity();

        setBirthdayLimit('inputBirthdayStart');
        setBirthdayLimit('inputBirthdayEnd');
        setBirthdayValidity('inputBirthdayStart');
        setBirthdayValidity('inputBirthdayEnd');

        setRatingScoreValidity('inputRatingScoreMin');
        setRatingScoreValidity('inputRatingScoreMax');

        setInputValueFromGetParams();
    });

    function setSearchPatternAttr() {
        const regexSearch = new RegExp("^[А-ЩЬЮЯЄІЇҐа-щьюяєіїґ'\\-\\d ]{1,200}$");
        document.getElementById('inputSearch').setAttribute('pattern', regexSearch.source);
    }

    function setSearchInputValidity() {
        const message = "Value is a Ukrainian a string between 1 and 200 chars long, optionally including numbers, dash, apostrophe, space.";

        document.getElementById('inputSearch').addEventListener('input', function () {
            if (this.validity.patternMismatch) {
                this.setCustomValidity(message);
            } else {
                this.setCustomValidity('');
            }

            this.reportValidity();
        });
    }

    function setBirthdayLimit(inputId) {
        document.getElementById(inputId).setAttribute('min', getBirthdayMinValue());
        document.getElementById(inputId).setAttribute('max', getBirthdayMaxValue());

        function getBirthdayMinValue() {
            const today = new Date();
            return new Date(
                today.getFullYear() - 110,
                today.getMonth(),
                today.getDate())
                .toISOString().split('T')[0];
        }

        function getBirthdayMaxValue() {
            const today = new Date();
            return new Date(today.getFullYear() - 16, today.getMonth(), today.getDate()).toISOString().split('T')[0];
        }
    }

    function setBirthdayValidity(inputId) {
        const regexpDate = new RegExp("^(?=.{10}$)\\d{4}\-\\d{2}\-\\d{2}");
        const messages = [
            "Invalid date format. Check the entered value.",
            "Value is a date from 110 to 16 years ago today."
        ];

        document.getElementById(inputId).addEventListener('mouseleave', function () {
            const minDate = new Date(this.min);
            const maxDate = new Date(this.max);
            const selectedDate = regexpDate.test(this.value) ? new Date(this.value) : null;

            if (!selectedDate) {
                this.setCustomValidity(messages[0]);
            } else if (selectedDate < minDate || selectedDate > maxDate) {
                this.setCustomValidity(messages[1]);
            } else {
                this.setCustomValidity("");
            }

            this.reportValidity();
        });
    }

    function setRatingScoreValidity(inputId) {
        const message = "Value is a decimal number in range from 120.001 to 200.000 inclusive.";

        document.getElementById(inputId).addEventListener('input', function () {
            const minVal = parseFloat(this.min);
            const maxVal = parseFloat(this.max);
            const selectedVal = parseFloat(this.value);

            if (selectedVal < minVal || selectedVal > maxVal) {
                this.setCustomValidity(message);
            } else {
                this.setCustomValidity("");
            }

            this.reportValidity();
        });
    }

    function setInputValueFromGetParams() {
        const currentURL = new URL(window.location.href);
        const params = new URLSearchParams(currentURL.searchParams);
        const inputFields = document.getElementsByTagName("input");

        for (const input of inputFields) {
            if (params.has(input.name)) {
                input.value = params.get(input.name);
            }
        }
    }

    function applySort(element) {
        const currentURL = new URL(window.location.href);
        const params = new URLSearchParams(currentURL.searchParams);

        const paramName = "sort";
        const paramFieldName = element.id;
        let paramSortOrder = 'asc';
        const currentSortValue = params.get(paramName);

        if (currentSortValue) {
            const currentSortFieldName = currentSortValue.split("-")[0];
            const currentSortOrder = currentSortFieldName === paramFieldName ? currentSortValue.split("-")[1] : '';
            paramSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
        }

        params.set(paramName, paramFieldName + '-' + paramSortOrder);

        const newURL = currentURL.pathname + '?' + params.toString();
        element.setAttribute('href', newURL);
    }

    function applySearch(linkButton) {
        const currentURL = new URL(window.location.href);
        const params = new URLSearchParams(currentURL.searchParams);

        setFilteringParameter(params, document.getElementById("inputSearch"));

        const newURL = currentURL.pathname + '?' + params.toString();
        linkButton.setAttribute('href', newURL);
    }

    function resetSearch(linkButton) {
        const currentURL = new URL(window.location.href);
        const params = new URLSearchParams(currentURL.searchParams);

        resetFilteringParameter(params, document.getElementById("inputSearch"));

        const newURL = currentURL.pathname + '?' + params.toString();
        document.getElementById("formSearch").reset();
        linkButton.setAttribute('href', newURL);
    }

    function applyFilterBirthday(linkButton) {
        const currentURL = new URL(window.location.href);
        const params = new URLSearchParams(currentURL.searchParams);

        setFilteringParameter(params, document.getElementById("inputBirthdayStart"));
        setFilteringParameter(params, document.getElementById("inputBirthdayEnd"));

        const newURL = currentURL.pathname + '?' + params.toString();
        linkButton.setAttribute('href', newURL);
    }

    function resetFilterBirthday(linkButton) {
        const currentURL = new URL(window.location.href);
        const params = new URLSearchParams(currentURL.searchParams);

        resetFilteringParameter(params, document.getElementById("inputBirthdayStart"));
        resetFilteringParameter(params, document.getElementById("inputBirthdayEnd"));

        const newURL = currentURL.pathname + '?' + params.toString();
        document.getElementById("formFilterBirthday").reset();
        linkButton.setAttribute('href', newURL);
    }

    function applyFilterRatingScore(linkButton) {
        const currentURL = new URL(window.location.href);
        const params = new URLSearchParams(currentURL.searchParams);

        setFilteringParameter(params, document.getElementById("inputRatingScoreMin"));
        setFilteringParameter(params, document.getElementById("inputRatingScoreMax"));

        const newURL = currentURL.pathname + '?' + params.toString();
        linkButton.setAttribute('href', newURL);
    }

    function resetFilterRatingScore(linkButton) {
        const currentURL = new URL(window.location.href);
        const params = new URLSearchParams(currentURL.searchParams);

        resetFilteringParameter(params, document.getElementById("inputRatingScoreMin"));
        resetFilteringParameter(params, document.getElementById("inputRatingScoreMax"));

        const newURL = currentURL.pathname + '?' + params.toString();
        document.getElementById("formFilterRatingScore").reset();
        linkButton.setAttribute('href', newURL);
    }

    function setFilteringParameter(params, inputElement) {
        const paramName = inputElement.name;
        const paramValue = inputElement.value.toString().trim();

        if (paramValue.length > 0) {
            params.set(paramName, paramValue);
        } else {
            params.delete(paramName);
        }
    }

    function resetFilteringParameter(params, inputElement) {
        const paramName = inputElement.name;
        params.delete(paramName);
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>
</html>
