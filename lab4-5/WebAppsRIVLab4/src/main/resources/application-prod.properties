spring.application.name=WebAppsRIVLab4

# TiDB Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${TIDB_URL}
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}

# JPA Configuration for production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# TiDB specific settings
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Logging Configuration
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.security=warn
logging.level.root=info

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Mail Configuration (використайте ваші налаштування)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
